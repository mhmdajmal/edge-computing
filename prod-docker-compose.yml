version: "3.9"

services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: smart_classroom_backend

    ports:
      - "8000:8000"

    volumes:
      - ./models:/app/models:ro
      - ./uploads:/app/uploads
      - ./logs:/app/logs

    environment:
      ENV: production
      HOST: 0.0.0.0
      PORT: 8000

    healthcheck:
      test: ["CMD","curl","-f","http://localhost:8000/api/dashboard"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}

    container_name: smart_classroom_frontend

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"